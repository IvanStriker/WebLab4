services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile_dev
    user: "1000:1000"
    working_dir: /frontend/lab4
    command: ["bash", "-c", "npm install && npx ng serve --host 0.0.0.0 --port 4000"]
    volumes:
      - ./frontend:/frontend
    init: true

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME:-students}
      POSTGRES_USER: ${DB_USER:-students}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-students}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:-students}?stringtype=unspecified
      DB_USER: ${DB_USER:-students}
      DB_PASSWORD: ${DB_PASSWORD:-students}
      JWT_SECRET: ${JWT_SECRET:-docker-dev-secret-0123456789abcdefghijklmnop}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-please}

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    ports:
      - 80:80
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
