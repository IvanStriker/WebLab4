@if (totalPages() > 1) {
  <div class="pagination">
    <button type="button" class="btn" [disabled]="disabled() || page() <= 1" (click)="pageChange.emit(1)">«</button>
    <button type="button" class="btn" [disabled]="disabled() || page() <= 1" (click)="pageChange.emit(page() - 1)">
      Назад
    </button>
    <span>Страница {{ page() }} из {{ totalPages() }}</span>
    <button
      type="button"
      class="btn"
      [disabled]="disabled() || page() >= totalPages()"
      (click)="pageChange.emit(page() + 1)"
    >
      Вперед
    </button>
    <button
      type="button"
      class="btn"
      [disabled]="disabled() || page() >= totalPages()"
      (click)="pageChange.emit(totalPages())"
    >
      »
    </button>
  </div>
}
