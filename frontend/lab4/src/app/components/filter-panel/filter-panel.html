<form [formGroup]="form" (ngSubmit)="submit()" class="panel filter-form">
  <p class="hint">Точное совпадение. Несколько значений в одном поле пишите через запятую</p>
  <div class="fields">
    @for (field of fields(); track field.key) {
      @switch (field.type) {
        @case ('checkboxes') {
          <div class="item">
            <span>{{ field.title }}</span>
            <fieldset [formGroupName]="field.key" [attr.aria-label]="field.title">
              @for (option of field.options; track option) {
                <label class="check"><input type="checkbox" [formControlName]="option" /> {{ option }}</label>
              }
            </fieldset>
            <small class="field-error"></small>
          </div>
        }
        @case ('date') {
          <label>
            {{ field.title }}
            <input type="date" [formControlName]="field.key" />
            <small class="field-error"></small>
          </label>
        }
        @default {
          <label>
            {{ field.title }}
            <input
              type="text"
              [formControlName]="field.key"
              [placeholder]="field.placeholder ?? ''"
              [attr.inputmode]="field.type === 'numbers' ? 'numeric' : null"
            />
            <small class="field-error">{{ errorText(control(field.key)) }}</small>
          </label>
        }
      }
    }
  </div>
  <div class="actions">
    <button type="submit" class="btn">Применить</button>
    <button type="button" class="btn btn-del" (click)="clear()">Сбросить</button>
  </div>
</form>
