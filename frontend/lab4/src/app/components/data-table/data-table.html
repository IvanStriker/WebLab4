<div class="table-wrap" [class.loading]="loading()">
  <table>
    <thead>
      <tr>
        @for (column of columns(); track column.key) {
          <th (click)="sortChange.emit(column.key)" class="sortable" title="Сортировать">
            {{ column.title }} <span class="mark" [class]="sortMark(column.key)"></span>
          </th>
        }
        @if (actions()) {
          <th>Действия</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of rows(); track rowKey(row)) {
        <tr>
          @for (column of columns(); track column.key) {
            <td>{{ cell(row, column.key) }}</td>
          }
          @if (actions(); as template) {
            <td>
              <div class="row-actions">
                <ng-container *ngTemplateOutlet="template; context: { $implicit: row }" />
              </div>
            </td>
          }
        </tr>
      } @empty {
        <tr>
          <td [attr.colspan]="columns().length + 1" class="empty">{{ emptyText() }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
