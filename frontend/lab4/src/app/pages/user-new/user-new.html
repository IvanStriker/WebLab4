<section class="narrow user-new">
  <a routerLink="/users" class="back">← К учетным записям</a>
  <form [formGroup]="form" (ngSubmit)="submit()" class="panel auth-form">
    <h2>Новый пользователь</h2>
    <fieldset [disabled]="action.busy()" class="fields">
      <label>
        Имя пользователя
        <input type="text" formControlName="username" autocomplete="off" placeholder="ivan_petrov" />
        <small class="field-error">
          {{ errorText(form.controls.username, 'От 3 до 32 символов: латинские буквы, цифры и _') || detail('username') }}
        </small>
      </label>
      <label>
        Почта
        <input type="email" formControlName="email" autocomplete="off" placeholder="name@mail.ru" />
        <small class="field-error">
          {{ errorText(form.controls.email, 'Некорректный адрес почты, пример: name@mail.ru') || detail('email') }}
        </small>
      </label>
      <label>
        Пароль
        <input type="password" formControlName="password" autocomplete="new-password" />
        <small class="field-error">{{ errorText(form.controls.password) || detail('password') }}</small>
      </label>
      <label>
        Роль
        <select formControlName="role">
          <option value="USER">USER</option>
          <option value="ADMIN">ADMIN</option>
        </select>
        <small class="field-error">{{ detail('role') }}</small>
      </label>
    </fieldset>
    @if (serverError()) {
      <p class="form-error">{{ serverError() }}</p>
    }
    <div class="actions">
      <button type="submit" class="btn btn-save" [disabled]="action.busy()">
        {{ action.busy() ? 'Сохранение...' : 'Создать' }}
      </button>
      <a routerLink="/users" class="btn btn-del">Отмена</a>
    </div>
  </form>
</section>
