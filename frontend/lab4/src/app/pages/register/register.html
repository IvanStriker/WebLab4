<form [formGroup]="form" (ngSubmit)="submit()" class="panel narrow auth-form">
  <h2>Регистрация</h2>
  <label>
    Имя пользователя
    <input type="text" formControlName="username" autocomplete="username" placeholder="ivan_petrov" />
    <small class="field-error">
      {{ errorText(form.controls.username, 'От 3 до 32 символов: латинские буквы, цифры и _') || detail('username') }}
    </small>
  </label>
  <label>
    Почта
    <input type="email" formControlName="email" autocomplete="email" placeholder="name@mail.ru" />
    <small class="field-error">
      {{ errorText(form.controls.email, 'Некорректный адрес почты, пример: name@mail.ru') || detail('email') }}
    </small>
  </label>
  <label>
    Пароль
    <input type="password" formControlName="password" autocomplete="new-password" />
    <small class="field-error">{{ errorText(form.controls.password) || detail('password') }}</small>
  </label>
  <label>
    Повторите пароль
    <input type="password" formControlName="confirm" autocomplete="new-password" />
    <small class="field-error">{{ errorText(form.controls.confirm) }}</small>
  </label>
  @if (serverError()) {
    <p class="form-error">{{ serverError() }}</p>
  }
  <button type="submit" class="btn btn-save" [disabled]="action.busy()">
    {{ action.busy() ? 'Регистрация...' : 'Зарегистрироваться' }}
  </button>
  <p class="switch">Уже есть учетная запись? <a routerLink="/login">Войти</a></p>
</form>
