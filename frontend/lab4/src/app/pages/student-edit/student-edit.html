<section class="edit">
  <a routerLink="/students" class="back">← К списку студентов</a>
  <h1>{{ isNew() ? 'Новый студент' : 'Редактирование студента ' + id() }}</h1>

  @if (state().loading) {
    <app-loader />
  } @else if (state().error; as error) {
    <div class="panel">
      <h2>{{ error.status === 404 ? 'Студент не найден' : 'Ошибка' }}</h2>
      <p>{{ error.message }}</p>
    </div>
  } @else {
    @if (formError()) {
      <p class="form-error panel">{{ formError() }}</p>
    }
    <app-student-form
      [student]="state().data"
      [busy]="saveAction.busy()"
      [serverErrors]="fieldErrors()"
      (submitted)="save($event)"
      (cancelled)="back()"
    />
  }
</section>
