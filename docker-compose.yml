services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Задайте DB_NAME в .env}
      POSTGRES_USER: ${DB_USER:?Задайте DB_USER в .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:?Задайте DB_NAME в .env}?stringtype=unspecified
      DB_USER: ${DB_USER:?Задайте DB_USER в .env}
      DB_PASSWORD: ${DB_PASSWORD:?Задайте DB_PASSWORD в .env}
      JWT_SECRET: ${JWT_SECRET:?Задайте JWT_SECRET в .env}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:?Задайте JWT_ACCESS_TTL_MINUTES в .env}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:?Задайте JWT_REFRESH_TTL_DAYS в .env}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?Задайте ADMIN_USERNAME в .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Задайте ADMIN_EMAIL в .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Задайте ADMIN_PASSWORD в .env}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_URL: ${BACKEND_URL:?Задайте BACKEND_URL в .env}
    ports:
      - "${APP_PORT:?Задайте APP_PORT в .env}:80"

volumes:
  pgdata:
